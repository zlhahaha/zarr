name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moonbit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm-gc
          - os: ubuntu-latest
            target: native
          - os: macos-15
            target: native
          - os: windows-latest
            target: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Build
        run: moon build --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Run example
        run: moon run --target ${{ matrix.target }} cmd/main
      - name: Run native filesystem example
        if: matrix.target == 'native'
        run: moon run --target native cmd/native_demo
      - name: Validate release archive
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'native'
        run: moon package --list
      - name: Set up Python for interoperability
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zarr-python test oracle
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'native'
        run: python -m pip install zarr==3.4.0 numpy==2.5.3
      - name: Verify MoonBit writes with zarr-python
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'native'
        run: |
          moon run --target native cmd/interop
          python scripts/verify_moonbit_roundtrip.py
