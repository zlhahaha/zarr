name: Real data scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent decoder
        run: python -m pip install zarr==3.4.0 numpy==2.5.3
      - name: Update dependencies
        run: moon update
      - name: Measure pinned real data through tile reader
        run: python scripts/benchmark_real_scan.py --download --quick --trials 2 --output _build/real-scan-ci.json
      - name: Verify real CT conversion against checkout
        run: python scripts/verify_real_volume_pipeline.py --source --trials 1 --output _build/real-volume-source-ci.json
      - name: Verify real CT conversion with published dependency
        run: python scripts/verify_real_volume_pipeline.py --trials 1 --output _build/real-volume-registry-ci.json
      - name: Compare complete conversion tasks (paired smoke)
        run: python scripts/benchmark_volume_pipeline.py --trials 1 --output _build/paired-volume-ci.json
      - name: Build and independently verify PNG showcase
        run: python scripts/demo_volume_pipeline.py --output-dir _build/ct-showcase-ci
      - name: Verify the published Zarr consumer and NumPy patch batch
        run: python scripts/verify_zarr_npy_roi.py --batch --output-dir _build/zarr-npy-batch-ci
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-scan
          path: |
            _build/real-scan-ci.json
            _build/real-volume-*-ci.json
            _build/real-volume-*-ci-artifacts/*.json
            _build/real-volume-*-ci-artifacts/*.log
            _build/paired-volume-ci.json
            _build/paired-volume-ci-artifacts/*.json
            _build/paired-volume-ci-artifacts/*.log
            _build/ct-showcase-ci/showcase.json
            _build/ct-showcase-ci/verification.json
            _build/zarr-npy-batch-ci/verification.json
          if-no-files-found: error
          retention-days: 30
